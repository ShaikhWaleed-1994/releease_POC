name: Promote Release (Reusable)


on:
  workflow_call:
    inputs:
      final_branch:
        description: "Branch to target once no higher-numbered branch exists in the family"
        required: false
        default: "master"
        type: string
    secrets:
      GHA_PR:
        description: >-
          Optional PAT / GitHub App token used to open the PR. Supply this when
          the org or enterprise disallows "Allow GitHub Actions to create and
          approve pull requests" — that policy applies to GITHUB_TOKEN only, so
          a user token is not subject to it. Falls back to GITHUB_TOKEN when
          unset. Needs only: Pull requests = read/write, Contents = read.
        required: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find next branch in the cascade
        id: next
        env:
          SRC: ${{ github.ref_name }}
          FINAL_BRANCH: ${{ inputs.final_branch }}
        shell: bash
        run: |
          set -euo pipefail

          # --- helper: split "<front-ending-in-non-digit><trailing-number>" ---
          # POSIX ERE (used by bash =~) has no non-greedy match, so we anchor the
          # trailing digits with [0-9]+$ and force the front to end in a non-digit.
          parse() {  # $1 = branch name; sets PARSE_STEM and PARSE_NUM, returns 1 if not a release branch
            local b="$1" front
            [[ "$b" =~ ^(.*[^0-9])([0-9]+)$ ]] || return 1
            front="${BASH_REMATCH[1]}"
            PARSE_NUM=$(( 10#${BASH_REMATCH[2]} ))
            # Drop the 3-part version so branches differing only by version share a family.
            [[ "$front" =~ ^(release_)[0-9]+\.[0-9]+\.[0-9]+(.*)$ ]] || return 1
            PARSE_STEM="${BASH_REMATCH[1]}${BASH_REMATCH[2]}"
            return 0
          }

          if ! parse "$SRC"; then
            echo "Branch '$SRC' is not a numbered release branch — nothing to promote. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          src_stem="$PARSE_STEM"
          src_num="$PARSE_NUM"
          echo "Source '$SRC' -> family '$src_stem', number $src_num, looking for the next higher number in this family."

          # The next branch is the LOWEST number strictly greater than ours in the
          # same family. Do not assume current+1 — the counter has gaps (a family
          # can hold both D21 and D2021).
          # KEEP IN SYNC with the guard workflow: if these two disagree, the
          # cascade opens PRs the guard refuses to let anyone merge.
          dest=""
          dest_num=-1
          while read -r _sha ref; do
            b="${ref#refs/heads/}"
            if parse "$b" && [[ "$PARSE_STEM" == "$src_stem" && "$PARSE_NUM" -gt "$src_num" ]]; then
              if [[ -z "$dest" || "$PARSE_NUM" -lt "$dest_num" ]]; then
                dest="$b"
                dest_num="$PARSE_NUM"
              fi
            fi
          done < <(git ls-remote --heads origin 'release_*')

          if [[ -z "$dest" ]]; then
            dest="$FINAL_BRANCH"
            echo "No higher-numbered branch in family '$src_stem' -> promoting to final branch '$FINAL_BRANCH'."
          else
            echo "Next branch is '$dest' -> promoting to it."
          fi

          if [[ "$dest" == "$SRC" ]]; then
            echo "Source and destination are identical ('$SRC') — nothing to promote. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "dest=$dest" >> "$GITHUB_OUTPUT"

      - name: Open promotion PR
        if: steps.next.outputs.skip != 'true'
        env:
          # Prefer the supplied PAT/App token; fall back to GITHUB_TOKEN for repos
          # whose org still permits Actions to create pull requests.
          GH_TOKEN: ${{ secrets.GHA_PR || secrets.GITHUB_TOKEN }}
          HAVE_PAT: ${{ secrets.GHA_PR != '' }}
          SRC: ${{ github.ref_name }}
          DEST: ${{ steps.next.outputs.dest }}
        shell: bash
        run: |
          set -euo pipefail

          # Surfaces which credential is in play — the usual cause of a failed
          # promotion is GHA_PR not reaching this workflow (missing "secrets:"
          # block in the caller, or the org secret not shared with the repo).
          if [[ "$HAVE_PAT" == "true" ]]; then
            echo "Using GHA_PR token to open the PR."
          else
            echo "GHA_PR not provided — falling back to GITHUB_TOKEN. This fails if the org"
            echo "disallows 'Allow GitHub Actions to create and approve pull requests'."
          fi

          # Nothing to promote if the destination already contains every commit from source.
          if [[ -z "$(git rev-list "origin/$DEST..origin/$SRC" 2>/dev/null || echo HAS_DIFF)" ]]; then
            echo "'$DEST' already contains everything in '$SRC'. Nothing to promote."
            exit 0
          fi

          # Idempotent: if the PR for this exact hop is already open, leave it.
          existing=$(gh pr list --state open --head "$SRC" --base "$DEST" --json number --jq '.[0].number' || true)
          if [[ -n "${existing:-}" ]]; then
            echo "PR #$existing already open for $SRC -> $DEST. Nothing to do."
            exit 0
          fi

          gh pr create \
            --head "$SRC" \
            --base "$DEST" \
            --title "Promote: $SRC → $DEST" \
            --body "Auto-generated promotion PR from \`$SRC\` into \`$DEST\` as part of the release cascade.

          Review and merge to advance the cascade toward \`${{ inputs.final_branch }}\`. Merging this PR triggers the next hop automatically."
